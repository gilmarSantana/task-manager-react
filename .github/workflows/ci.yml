name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # baixa o código
      - uses: actions/setup-node@v4        # instala o Node
        with:
          node-version: 20
          cache: npm
      - run: npm ci                        # instala dependências do package-lock
      - run: npm run lint                  # verifica o estilo e erros comuns
      - run: npm run build                 # garante que o projeto compila